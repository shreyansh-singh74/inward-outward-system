services:
  db:
    image: mysql:8.0
    container_name: inward-outward-db
    restart: unless-stopped
    environment:
      # Raw password (as typed), used by the MySQL container.
      # Keep DB_ROOT_PASSWORD_URL below URL-encoded to match this.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tcet@1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-turn_in_turn_out}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-tcet@1234}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inward-outward-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: inward-outward-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: mysql+mysqlconnector://root:${DB_ROOT_PASSWORD_URL:-tcet%401234}@db:3306/${MYSQL_DATABASE:-turn_in_turn_out}
      REDIS_URL: redis://redis:6379/0
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:alpine
    container_name: inward-outward-proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

volumes:
  mysql_data:
  redis_data:
  media_data:

