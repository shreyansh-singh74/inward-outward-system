services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # No default fallback: fail startup if not provided
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-turn_in_turn_out}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: mysql+mysqlconnector://root:${DB_ROOT_PASSWORD_URL:?DB_ROOT_PASSWORD_URL must be set (URL-encoded root password)}@db:3306/${MYSQL_DATABASE:-turn_in_turn_out}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLIENT_URL: ${CLIENT_URL:-https://localhost}
    # No ports published: Traefik reaches web over the compose network.
    # No cloudflared service: the tunnel runs at the host/platform level.
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.inward-web.rule=Host(`${DOMAIN:?DOMAIN must be set}`)"
      - traefik.http.services.inward-web.loadbalancer.server.port=8000
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
  media_data:

networks:
  dokploy-network:
    external: true
