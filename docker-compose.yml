services:
  db:
    image: mysql:8.0
    container_name: inward-outward-db
    restart: unless-stopped
    environment:
      # No default fallback: fail startup if not provided
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-turn_in_turn_out}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inward-outward-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: inward-outward-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: mysql+mysqlconnector://root:${DB_ROOT_PASSWORD_URL:?DB_ROOT_PASSWORD_URL must be set (URL-encoded root password)}@db:3306/${MYSQL_DATABASE:-turn_in_turn_out}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLIENT_URL: ${CLIENT_URL:-https://localhost}
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:alpine
    container_name: inward-outward-proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      # Cloudflare Tunnel is the only ingress: bind to localhost only so
      # nothing on the college LAN can reach the origin directly.
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: inward-outward-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set (create the tunnel in Cloudflare dashboard)}
    network_mode: host

volumes:
  mysql_data:
  redis_data:
  media_data:
